aid: quibim
name: QUIBIM
description: 'QUIBIM is a healthcare AI company that unlocks medical imaging data to improve
  patient outcomes through quantitative imaging biomarkers and radiomics. Its cloud-based,
  tissue-agnostic platform ingests, harmonizes, and analyzes imaging data (MRI, CT, PET)
  to extract automated radiomics and deep-learning imaging biomarkers that support clinical
  decision-making and biopharma drug development. Regulated clinical products include
  QP-Prostate, QP-Brain, QP-Liver, QP-Breast, QP-Lung, and the QP-Insights multi-omics
  platform, several of which are CE and UKCA marked and integrate with hospital PACS
  systems. QUIBIM is ISO 27001:2022 certified and HIPAA and GDPR compliant. This profile
  was surfaced as a portfolio company of Partech and enriched by the API Evangelist pipeline;
  QUIBIM publishes no public developer API surface at this time.'
